[package]
name = "editor-gpui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# The gpui example editor — a LIBRARY CONSUMER, deliberately its own
# crate: it links the adapter plus the engine parts an embedder
# would, and nothing of the workbench app.
[dependencies]
himark = { path = "../../frontend/himark" }
himark-gpui = { path = "../../frontend/himark-gpui" }
himark-plugins = { path = "../../frontend/himark-plugins" }
hikit = { path = "../../frontend/hikit" }
imba = { path = "../../frontend/imba" }
documents = { path = "../../frontend/documents" }
editor = { path = "../../frontend/editor" }
text = { path = "../../frontend/text" }
myersdiff = { path = "../../frontend/myersdiff" }

[[bin]]
name = "editor-gpui"
path = "src/main.rs"
