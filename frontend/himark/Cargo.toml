[package]
name = "himark"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
ahp-types = "0.9"
himark-ahp-ext-types = { path = "../../protocol/ahp-ext-types" }
host-discovery = { path = "../../protocol/host-discovery" }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rpds = "1"
changesview = { path = "../changesview" }
canvas = { path = "../canvas" }
comments = { path = "../comments" }
ahp-wire = { path = "../ahp-wire" }
ahp-chat = { path = "../ahp-chat" }
ahp-changes = { path = "../ahp-changes" }
ahp-comments = { path = "../ahp-comments" }
ahp-locations = { path = "../ahp-locations" }
ahp-docsync = { path = "../ahp-docsync" }
ahp-lsp = { path = "../ahp-lsp" }
ahp-session = { path = "../ahp-session" }
hikit = { path = "../hikit" }
recents = { path = "../recents" }
documents = { path = "../documents" }
locations = { path = "../locations" }
terminals = { path = "../terminals" }
toc = { path = "../toc" }
workbench = { path = "../workbench" }
editor = { path = "../editor" }
filetree = { path = "../filetree" }
myersdiff = { path = "../myersdiff" }
imba = { path = "../imba" }
operation = { path = "../operation" }
rebase = { path = "../rebase" }
skia-safe = { version = "0.153.3", features = ["textlayout"] }
text = { path = "../text" }

[features]
test-support = [
    "workbench/test-support", 
    "editor/test-support", 
    "hikit/test-support", 
    "changesview/test-support", 
    "canvas/test-support", 
    "filetree/test-support", 
    "toc/test-support", 
    "ahp-session/test-support"
]

[dev-dependencies]
editor = { path = "../editor", features = ["test-support"] }
hikit = { path = "../hikit", features = ["test-support"] }
changesview = { path = "../changesview", features = ["test-support"] }
canvas = { path = "../canvas", features = ["test-support"] }
toc = { path = "../toc", features = ["test-support"] }
ahp-session = { path = "../ahp-session", features = ["test-support"] }
himarkdown = { path = "../plugins/himarkdown" }
