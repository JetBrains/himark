[package]
name = "himark"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
ahp = "0.9"
ahp-types = "0.9"
base64 = "0.22"
tracing = "0.1"
himark-ahp-ext-types = { path = "../../protocol/ahp-ext-types" }
host-discovery = { path = "../../protocol/host-discovery" }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rpds = "1"
changesview = { path = "../changesview" }
canvas = { path = "../canvas" }
comments = { path = "../comments" }
hikit = { path = "../hikit" }
documents = { path = "../documents" }
locations = { path = "../locations" }
terminals = { path = "../terminals" }
toc = { path = "../toc" }
editor = { path = "../editor" }
filetree = { path = "../filetree" }
myersdiff = { path = "../myersdiff" }
imba = { path = "../imba" }
operation = { path = "../operation" }
rebase = { path = "../rebase" }
skia-safe = { version = "0.153.3", features = ["textlayout"] }
text = { path = "../text" }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
test-support = ["editor/test-support", "hikit/test-support", "changesview/test-support", "canvas/test-support", "filetree/test-support", "toc/test-support"]

[dev-dependencies]
editor = { path = "../editor", features = ["test-support"] }
hikit = { path = "../hikit", features = ["test-support"] }
changesview = { path = "../changesview", features = ["test-support"] }
canvas = { path = "../canvas", features = ["test-support"] }
toc = { path = "../toc", features = ["test-support"] }
himarkdown = { path = "../plugins/himarkdown" }
