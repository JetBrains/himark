[package]
name = "himark"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rpds = "1"
# The wasm-safe base; the C surface's runtime features (the net
# driver pulls mio, which has no wasm port) ride the native-only
# dependency below, the ahp-wire pattern.
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
changesview = { path = "../changesview" }
canvas = { path = "../canvas" }
hikit = { path = "../hikit" }
documents = { path = "../documents" }
locations = { path = "../locations" }
toc = { path = "../toc" }
editor = { path = "../editor" }
myersdiff = { path = "../myersdiff" }
imba = { path = "../imba" }
skia-safe = { version = "0.153.3", optional = true }
gfx = { path = "../gfx" }
gfx-skia = { path = "../gfx-skia", optional = true }
text = { path = "../text" }

# The C surface's runtime (ffi/mod.rs, gated off wasm) builds the
# multi-thread runtime with the net and io drivers.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }

[features]
# The Swift shell hands this crate raw skia canvases over the C ABI —
# the apple staticlib (frontend-host's default) turns this on. Off by
# default so no other shell links skia through this crate.
skia-shell = ["dep:skia-safe", "dep:gfx-skia"]
test-support = [
    "editor/test-support", 
    "hikit/test-support", 
    "changesview/test-support", 
    "canvas/test-support", 
    "toc/test-support",
]

[dev-dependencies]
gfx-skia = { path = "../gfx-skia" }
editor = { path = "../editor", features = ["test-support"] }
hikit = { path = "../hikit", features = ["test-support"] }
changesview = { path = "../changesview", features = ["test-support"] }
canvas = { path = "../canvas", features = ["test-support"] }
toc = { path = "../toc", features = ["test-support"] }
himarkdown = { path = "../plugins/himarkdown" }

