language = "C"
header = "/* Copyright © 2026 JetBrains s.r.o. */\n/* SPDX-License-Identifier: Apache-2.0 */"
include_guard = "HIMARK_H"
pragma_once = true
tab_width = 4
style = "type"
autogen_warning = "/* Generated by cbindgen from himark — do not edit. */"

# The host's one door — defined in frontend-host (it assembles the
# plugin list and dials the agent hosts), declared here so the one
# header covers the whole surface.
trailer = """
/* The host's one door — defined in frontend-host, which assembles
   the plugin list and dials the agent hosts. */
HimarkEngine *himark_create(HimarkEngineCallbacks callbacks);
"""

[parse]
parse_deps = false

[export]
include = ["HimarkEngineCallbacks"]
exclude = ["MOUNT_BASE"]
