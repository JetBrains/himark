[package]
name = "hiahp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# The AHP PLUGIN: the agent-protocol half of the app, over the
# himark engine's registered seams (batch lanes, sweep hooks, mount
# binders, file routes, place arms). himark itself keeps no ahp-*
# dependency once this crate owns the half.
[dependencies]
himark = { path = "../himark" }
imba = { path = "../imba" }
gfx = { path = "../gfx" }
hikit = { path = "../hikit" }
editor = { path = "../editor" }
documents = { path = "../documents" }
locations = { path = "../locations" }
filetree = { path = "../filetree" }
canvas = { path = "../canvas" }
changesview = { path = "../changesview" }
comments = { path = "../comments" }
myersdiff = { path = "../myersdiff" }
text = { path = "../text" }
ahp-types = "0.9"
ahp-wire = { path = "../ahp-wire" }
ahp-chat = { path = "../ahp-chat" }
ahp-changes = { path = "../ahp-changes" }
ahp-comments = { path = "../ahp-comments" }
ahp-locations = { path = "../ahp-locations" }
ahp-docsync = { path = "../ahp-docsync" }
ahp-lsp = { path = "../ahp-lsp" }
ahp-session = { path = "../ahp-session" }
rpds = "1"
recents = { path = "../recents" }

[dev-dependencies]
serde_json = "1"
