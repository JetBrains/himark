[package]
name = "himark-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
himark = { path = "../himark" }
imba = { path = "../imba" }
gfx = { path = "../gfx" }
editor = { path = "../editor" }
documents = { path = "../documents" }
hikit = { path = "../hikit" }
myersdiff = { path = "../myersdiff" }
tokio = { version = "1", features = ["rt-multi-thread"] }
gfx-gpui = { path = "../gfx-gpui", optional = true }

# gpui's Metal renderer and CoreText text system, with no gpui app
# or window: the host owns the CAMetalLayer. runtime_shaders: the
# build machine needs no Xcode Metal Toolchain.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.13", features = ["font-kit", "runtime_shaders"], optional = true }
objc2-quartz-core = { version = "0.3", optional = true }

[build-dependencies]
cbindgen = "0.29.4"

[features]
# The apple shells draw through gpui's renderer over a layer they own.
metal-shell = ["dep:gfx-gpui", "dep:gpui_apple", "dep:objc2-quartz-core"]
