language = "C"
header = "/* Copyright © 2026 JetBrains s.r.o. */\n/* SPDX-License-Identifier: Apache-2.0 */"
include_guard = "HIMARK_H"
pragma_once = true
tab_width = 4
style = "type"
autogen_warning = "/* Generated by cbindgen from himark-ffi — do not edit. */"
# `Himark` IS the engine (one Rust type); `HimarkEngine` below is the
# alias the header has always spoken. cbindgen can't see the foreign
# type, so the opaque declaration is spliced here.
after_includes = "typedef struct Himark Himark;\ntypedef struct HimarkPlugins HimarkPlugins;"

# The plugin-set handle is opaque (declared in after_includes);
# cbindgen must not try to lay out its Rust-only insides.
[export]
exclude = ["HimarkPlugins"]

# The tailnet STATES (docs/ahp/tailnet.md) — plain values the Swift
# shell matches on; `himark_tailnet_state` answers one of these.
