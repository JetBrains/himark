[package]
name = "comments"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
documents = { path = "../documents" }
editor = { path = "../editor" }
hikit = { path = "../hikit" }
imba = { path = "../imba" }
rpds = "1"
skia-safe = "0.153.3"
text = { path = "../text" }

[features]
test-support = ["hikit/test-support"]

[dev-dependencies]
hikit = { path = "../hikit", features = ["test-support"] }
