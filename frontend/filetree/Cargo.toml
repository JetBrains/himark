[package]
name = "filetree"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
documents = { path = "../documents" }
editor = { path = "../editor" }
text = { path = "../text" }
hikit = { path = "../hikit" }
imba = { path = "../imba" }
rpds = "1"
gfx = { path = "../gfx" }

[features]
test-support = ["hikit/test-support"]

[dev-dependencies]
gfx-skia = { path = "../gfx-skia" }
editor = { path = "../editor", features = ["test-support"] }
hikit = { path = "../hikit", features = ["test-support"] }
