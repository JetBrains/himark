[package]
name = "hikit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
documents = { path = "../documents" }
editor = { path = "../editor" }
imba = { path = "../imba" }
rpds = "1"
skia-safe = "0.153.3"

[features]
test-support = []

[dev-dependencies]
editor = { path = "../editor", features = ["test-support"] }
