[package]
name = "imba"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
rope = { path = "../rope" }
intervals = { path = "../intervals" }
bumpalo = { version = "3.16.0", features = ["collections", "boxed"] }
