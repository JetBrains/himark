[package]
name = "imba"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
rope = { path = "../rope" }
intervals = { path = "../intervals" }
bumpalo = { version = "3.16.0", features = ["collections", "boxed"] }
rpds = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gfx = { path = "../gfx" }
image = "0.25"
parley = { version = "0.12", default-features = false, features = ["std", "system", "complex-scripts"] }
skrifa = "0.46"
resvg = "0.48"

[dev-dependencies]
gfx-skia = { path = "../gfx-skia" }
