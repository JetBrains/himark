[package]
name = "hitailnet"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
himark = { path = "../himark" }
himark-plugins = { path = "../himark-plugins" }
desktop = { path = "../desktop" }
ahp-wire = { path = "../ahp-wire" }
ahp-session = { path = "../ahp-session" }
imba = { path = "../imba" }
tailnet = { path = "../../protocol/tailnet" }
host-discovery = { path = "../../protocol/host-discovery" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
