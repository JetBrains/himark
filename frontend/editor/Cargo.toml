[package]
name = "editor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imba = { path = "../imba" }
intervals = { path = "../intervals" }
operation = { path = "../operation" }
rope = { path = "../rope" }
sumtree = { path = "../sumtree" }
rpds = "1"
regex = "1"
skia-safe = { version = "0.153.3", features = ["textlayout"] }
text = { path = "../text" }
tokenize = { path = "../tokenize" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# ganesh for the band cache's context identity — one shell, many
# GPU contexts; a snapshot drawn cross-context comes out black.
skia-safe = { version = "0.153.3", features = ["ganesh", "textlayout"] }

[features]
test-support = []

[dev-dependencies]
myersdiff = { path = "../myersdiff" }
