[package]
name = "editor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imba = { path = "../imba" }
intervals = { path = "../intervals" }
operation = { path = "../operation" }
rope = { path = "../rope" }
sumtree = { path = "../sumtree" }
rpds = "1"
skia-safe = { version = "0.99.0", features = ["textlayout"] }
text = { path = "../text" }
tokenize = { path = "../tokenize" }
similar = "2.6"

[features]
test-support = []
