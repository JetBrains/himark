[package]
name = "editor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imba = { path = "../imba" }
intervals = { path = "../intervals" }
operation = { path = "../operation" }
rope = { path = "../rope" }
sumtree = { path = "../sumtree" }
rpds = "1"
regex = "1"
skia-safe = { version = "0.153.3", features = ["textlayout"] }
text = { path = "../text" }
tokenize = { path = "../tokenize" }

# "system" needs yeslogic-fontconfig-sys 6 — the winit shell's CSD
# moved off crossfont (which pinned v5) to make room.
parley = { version = "0.12", optional = true, default-features = false, features = ["std", "system", "complex-scripts"] }

[features]
parley-text = ["dep:parley"]
test-support = []

[dev-dependencies]
myersdiff = { path = "../myersdiff" }
