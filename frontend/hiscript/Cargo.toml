[package]
name = "hiscript"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["plugin"]
plugin = ["dep:himark", "dep:operation", "dep:imba", "dep:myersdiff"]

[dependencies]
workbench = { path = "../workbench" }
changesview = { path = "../changesview" }
documents = { path = "../documents" }
ahp-wire = { path = "../ahp-wire" }
ahp-session = { path = "../ahp-session" }
ahp-types = "0.9"
ahp-chat = { path = "../ahp-chat" }
rquickjs = { version = "0.14", features = ["bindgen"] }
text = { path = "../text" }
himark = { path = "../himark", optional = true }
editor = { path = "../editor" }
imba = { path = "../imba", optional = true }
operation = { path = "../operation", optional = true }
myersdiff = { path = "../myersdiff", optional = true }

[dev-dependencies]
himark = { path = "../himark", features = ["test-support"] }
editor = { path = "../editor" }
serde_json = "1"

[[bin]]
name = "hiscript-spike"
path = "src/spike.rs"
