[package]
name = "himermaid"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
ahp-session = { path = "../../ahp-session" }
editor = { path = "../../editor" }
himark = { path = "../../himark" }
imba = { path = "../../imba" }
operation = { path = "../../operation" }
text = { path = "../../text" }
merman = { version = "=0.8.0-alpha.5", default-features = false, features = ["svg"] }
skia-safe = { version = "0.153.3", features = ["textlayout"] }

[dev-dependencies]
operation = { path = "../../operation" }
himark = { path = "../../himark", features = ["test-support"] }
himarkdown = { path = "../himarkdown" }
