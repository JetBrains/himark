[package]
name = "himermaid"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
hikit = { path = "../../hikit" }
ahp-session = { path = "../../ahp-session" }
editor = { path = "../../editor" }
himark = { path = "../../himark" }
imba = { path = "../../imba" }
operation = { path = "../../operation" }
text = { path = "../../text" }
merman = { version = "=0.8.0-alpha.7", default-features = false, features = ["svg"] }
gfx = { path = "../../gfx" }

[dev-dependencies]
gfx-skia = { path = "../../gfx-skia" }
operation = { path = "../../operation" }
himark = { path = "../../himark", features = ["test-support"] }
himarkdown = { path = "../himarkdown" }
