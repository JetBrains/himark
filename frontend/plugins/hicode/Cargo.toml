himark = { path = "../../himark" }
editor = { path = "../../editor" }
imba = { path = "../../imba" }
text = { path = "../../text" }
skia-safe = { version = "0.153.3", features = ["textlayout"] }

[dev-dependencies]
himark = { path = "../../himark", features = ["test-support"] }
editor = { path = "../../editor" }
himark-ahp-ext-types = { path = "../../../protocol/ahp-ext-types" }
serde_json = "1"
