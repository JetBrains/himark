[package]
name = "hidiff"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
rpds = "1"
himark = { path = "../../himark" }
imba = { path = "../../imba" }
skia-safe = { version = "0.99.0", features = ["textlayout"] }

[dev-dependencies]
editor = { path = "../../editor" }
operation = { path = "../../operation" }
himark = { path = "../../himark", features = ["test-support"] }
himarkdown = { path = "../himarkdown" }
demo = { path = "../demo" }
