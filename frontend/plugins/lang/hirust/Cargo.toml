[package]
name = "hirust"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
editor = { path = "../../../editor" }
hisitter = { path = "../../../hisitter" }

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
tree-sitter-rust = "0.24.2"

[dev-dependencies]
himark = { path = "../../../himark", features = ["test-support"] }
himarkdown = { path = "../../himarkdown" }
imba = { path = "../../../imba" }
operation = { path = "../../../operation" }
skia-safe = { version = "0.153.3", features = ["textlayout"] }
text = { path = "../../../text" }
