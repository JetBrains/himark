[package]
name = "himarkdown"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
ahp-wire = { path = "../../ahp-wire" }
documents = { path = "../../documents" }
ahp-session = { path = "../../ahp-session" }
himark = { path = "../../himark", features = ["test-support"] }
workbench-shell = { path = "../../workbench-shell" }
editor = { path = "../../editor" }
imba = { path = "../../imba" }
mdparser = { path = "../../mdparser" }
operation = { path = "../../operation" }
gfx = { path = "../../gfx" }
text = { path = "../../text" }
hisitter = { path = "../../hisitter" }
tree-sitter = "0.26.8"

[dev-dependencies]
gfx-skia = { path = "../../gfx-skia" }
