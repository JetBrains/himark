name: himark
options:
  bundleIdPrefix: dev.himark
  # XcodeGen defaults to the newest project format, which Xcode 15 cannot
  # open. Keep the generated project readable by every Xcode 15 release.
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  himark-iOS:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/iOS
      # The chrome face and the mono face, for the native words
      # (Info-iOS.plist's UIAppFonts), and the phone's theme pair the
      # native chrome reads its ink and ramp from.
      - path: ../../frontend/editor/assets/BricolageGrotesque-Variable.ttf
        buildPhase: resources
      - path: ../../frontend/editor/assets/JetBrainsMono-Regular.ttf
        buildPhase: resources
      - path: ../../frontend/editor/assets/theme-ios.json
        buildPhase: resources
      - path: ../../frontend/editor/assets/theme-ios-light.json
        buildPhase: resources
    configFiles: { Release: Generated-iOS.xcconfig, Debug: Generated-iOS.xcconfig }
    # ⌘R builds the Rust staticlib for this SDK first — a stale
    # libhimark_plugins.a was the silent failure; build.sh stays the
    # from-scratch and xcconfig-(re)generation road.
    preBuildScripts:
      - name: Build Rust (himark-plugins)
        script: exec "$SRCROOT/xcode-build-rust.sh"
        shell: /bin/bash
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.himark.ios
        INFOPLIST_FILE: Info-iOS.plist
        SWIFT_VERSION: "5.9"
        # The Rust pre-build phase writes target/ and himark.h.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: himark-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        TARGETED_DEVICE_FAMILY: "1,2"
    frameworks: [UIKit.framework, Metal.framework, MetalKit.framework, QuartzCore.framework]
    scheme: {}
