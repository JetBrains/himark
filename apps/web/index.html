<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>himark</title>
    <link rel="preload" href="./web.js" as="script" />
    <!-- The in-page tailnet's main-thread half: a few lines now, the
         Go node lazily on the first Connect Tailscale. -->
    <script src="./tailnet-boot.js" defer></script>
    <!-- Emscripten fetches web.wasm with `credentials: "same-origin"`.
         `crossorigin` gives this preload the matching CORS and credentials
         modes, so that fetch consumes it instead of downloading twice. -->
    <link
      rel="preload"
      href="./web.wasm"
      as="fetch"
      type="application/wasm"
      crossorigin
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        /* The window background — no white flash before first paint. */
        background: #16161e;
      }

      /* The page IS the himark window: one full-viewport canvas, the
         app drawing its own chrome (toolbar, panes, drawers) exactly
         like the desktop shells. No DOM UI. */
      #canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        outline: none;
        user-select: none;
        -webkit-user-select: none;
      }

      /* The TEXT SEAT: the one focused node the browser speaks text
         through — clipboard events, IME composition, the mobile soft
         keyboard. Invisible but never display:none (an undisplayed
         node takes no focus and hears no events), and inside the
         viewport so focusing it never scrolls the page. */
      #input {
        position: fixed;
        top: 0;
        left: 0;
        width: 2px;
        height: 2px;
        padding: 0;
        border: none;
        opacity: 0;
        outline: none;
        resize: none;
        overflow: hidden;
        /* Below the canvas and transparent to the pointer: the seat
           holds focus and hears events; it is never hit-tested. */
        z-index: -1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- The daemon injects HIMARK_AHP_URL when it serves this page. A
         separately hosted build can instead select a host with
         `?agent_host=<http-or-websocket-url>`; the explicit parameter
         wins when both are present. -->
    <script>
      window.HIMARK_SERVED_BY_AGENT_HOST = Boolean(window.HIMARK_AHP_URL);
      const configuredAgentHost = new URLSearchParams(window.location.search).get(
        "agent_host",
      );
      if (configuredAgentHost) window.HIMARK_AHP_URL = configuredAgentHost;

      // Cross-origin isolation: the daemon serves real COOP/COEP
      // headers. Separately hosted builds still need the service-worker
      // shim even when their agent host was supplied above.
      if (!window.HIMARK_SERVED_BY_AGENT_HOST) {
        const shim = document.createElement("script");
        shim.src = "coi-serviceworker.js";
        document.head.appendChild(shim);
      }
    </script>
    <canvas id="canvas"></canvas>
    <textarea
      id="input"
      inputmode="none"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      wrap="off"
      aria-hidden="true"
    ></textarea>
    <script>
      // Everything but Module stays out of global scope: emscripten's
      // web.js declares its own top-level names (`run` among them).
      var Module;
      (() => {
        const canvas = document.getElementById("canvas");
        // Right-click is the app's context press, not the browser's.
        canvas.addEventListener("contextmenu", (event) => event.preventDefault());
        // The command bridge the app polls once per frame — kept as a
        // dev door (push from the console); no DOM UI feeds it.
        const queue = [];
        Module = {
          canvas,
          himarkPoll: () => (queue.length ? queue.shift() : ""),
        };

        // ─── The text seat ─────────────────────────────────────────
        // The hidden textarea holds focus for the whole page: the
        // browser's copy/cut/paste commands, IME composition and the
        // mobile soft keyboard all speak to the FOCUSED EDITABLE, so
        // the one node is the canvas app's whole text contract. Each
        // event calls straight into the engine (Module._himark_*) —
        // synchronous, so it stays ordered with the keydown stream.
        const input = document.getElementById("input");
        let composing = false;

        // Copy and cut are only ENABLED over a non-collapsed editable
        // selection: a one-space sentinel stays selected so the
        // browser always fires their events; the handlers substitute
        // the engine's answer for it.
        const arm = () => {
          if (composing) return;
          input.value = " ";
          input.select();
        };
        arm();
        input.focus({ preventScroll: true });
        // The page has no other focusable UI: wherever focus falls
        // (a canvas click lands it on body), it comes back here.
        input.addEventListener("blur", () => {
          setTimeout(() => input.focus({ preventScroll: true }), 0);
        });

        const intoEngine = (door, text) => {
          if (!Module[door] || !Module.stringToNewUTF8) return false;
          const ptr = Module.stringToNewUTF8(text);
          try {
            Module[door](ptr);
          } finally {
            Module._free(ptr);
          }
          return true;
        };

        const clip = (cut) => (event) => {
          // preventDefault either way: the sentinel space must never
          // reach the clipboard. With no setData the clipboard simply
          // keeps what it held.
          event.preventDefault();
          if (!Module._himark_clipboard_take || !Module.UTF8ToString) return;
          const taken = Module._himark_clipboard_take(cut ? 1 : 0);
          if (!taken) return;
          event.clipboardData.setData("text/plain", Module.UTF8ToString(taken));
          arm();
        };
        input.addEventListener("copy", clip(false));
        input.addEventListener("cut", clip(true));

        input.addEventListener("paste", (event) => {
          event.preventDefault();
          const text = event.clipboardData
            ? event.clipboardData.getData("text/plain")
            : "";
          if (!text) return;
          intoEngine("_himark_clipboard_paste", text);
          arm();
        });

        // Soft-keyboard text arrives here, not as key events: desktop
        // keydowns the engine consumes are prevented and never reach
        // this node, so the two roads cannot double-type.
        input.addEventListener("beforeinput", (event) => {
          if (composing || event.isComposing) return;
          if (
            event.inputType === "insertText" ||
            event.inputType === "insertFromComposition"
          ) {
            event.preventDefault();
            if (event.data) intoEngine("_himark_text_input", event.data);
            arm();
          }
        });

        // The soft keyboard follows the ENGINE's text focus, never
        // the DOM's: the seat stays focused for clipboard and IME,
        // and only its inputmode flips — "none" keeps every virtual
        // keyboard down. The app probes its IME seat after each
        // input event and calls here on a change, still inside the
        // user gesture mobile browsers demand for a keyboard raise.
        Module.himarkTextFocus = (wants) => {
          if (composing) return;
          const mode = wants ? "text" : "none";
          if (input.getAttribute("inputmode") === mode) return;
          input.setAttribute("inputmode", mode);
          // The flip only lands on a (re)focus.
          input.blur();
          input.focus({ preventScroll: true });
        };

        // IME: the composition mirrors into the engine's marked text
        // and commits through the same door the native shells use.
        input.addEventListener("compositionstart", () => {
          composing = true;
        });
        input.addEventListener("compositionupdate", (event) => {
          intoEngine("_himark_ime_set", event.data || "");
        });
        input.addEventListener("compositionend", (event) => {
          composing = false;
          intoEngine("_himark_ime_commit", event.data || "");
          arm();
        });
      })();
    </script>
    <script>
      // The pthread build may execute only after isolation is active. A
      // separately hosted secure page gets one bootstrap pass in which its
      // service worker registers and reloads it; every other isolation miss is
      // terminal. In particular, a bare LAN HTTP origin cannot register that
      // worker and must not fall through into web.js/SharedArrayBuffer.
      const waitingForIsolationBootstrap =
        !window.HIMARK_SERVED_BY_AGENT_HOST &&
        window.isSecureContext &&
        "serviceWorker" in navigator;
      if (!window.crossOriginIsolated && waitingForIsolationBootstrap) {
        document.body.innerHTML =
          "<div style='color:#c9d2e4;background:#16161e;font:16px sans-serif;" +
          "padding:3em;height:100vh;box-sizing:border-box'>" +
          "<h2>This origin can't run himark</h2>" +
          "<p>Cross-origin isolation is unavailable here: browsers only honor " +
          "the isolation headers over <b>https</b> or <b>localhost</b>.</p>" +
          "<p>Open this page as <b>http://localhost:&lt;port&gt;/?tkn=…</b> on the " +
          "host machine, or tunnel it: <code>ssh -L &lt;port&gt;:localhost:&lt;port&gt; " +
          "&lt;host&gt;</code> and use the localhost URL.</p></div>";
      } else {
        const engine = document.createElement("script");
        engine.async = true;
        engine.src = "./web.js";
        document.body.appendChild(engine);
      }
    </script>
  </body>
</html>
