# cargo-audit's config — CI runs `cargo audit --deny warnings`
# (.github/workflows/tests.yml), so every ignore here carries its
# justification.
#
# Most of the list rides in through gpui (`gpui-pre`, pinned exactly
# in frontend/gfx-gpui/Cargo.toml): these carry no fix we can take
# without a gpui bump, and parse no untrusted input on our roads.
# Re-audit the whole list when the pin moves: empty `ignore`, run
# `cargo audit --deny warnings`, and keep only what still fires.

[advisories]
ignore = [
    # ttf-parser is unmaintained (no fix released). Transitive only:
    # via gpui's cosmic-text/fontdb and via usvg — it parses fonts we
    # ship or the system provides, not documents.
    "RUSTSEC-2026-0192",
    # rustybuzz unmaintained — usvg (resvg: ours, and gpui's); it
    # shapes text inside SVGs we rasterize from our own
    # markdown/mermaid road. Drop when resvg moves to harfrust.
    "RUSTSEC-2026-0206",
    # paste unmaintained — a proc macro under the image crate's
    # codecs (exr's pulp, rav1e), which gpui turns on.
    "RUSTSEC-2024-0436",
    # The zbus family is unmaintained — oo7 (gpui's linux keyring).
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0372",
    # chrono unmaintained — gpui's own dependency.
    "RUSTSEC-2026-0543",
    # humantime unmaintained — OURS: the RFC 3339 stamps of the agent
    # host and the session summaries. It formats and parses
    # timestamps we wrote ourselves; replace it when a successor
    # settles.
    "RUSTSEC-2026-0542",
]
