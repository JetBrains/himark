[target.wasm32-unknown-emscripten]
linker = "emcc"
rustflags = [
    "-C",
    "panic=abort",
    "-C",
    "link-arg=-sUSE_WEBGL2=1",
    "-C",
    "link-arg=-sMIN_WEBGL_VERSION=2",
    "-C",
    "link-arg=-sMAX_WEBGL_VERSION=2",
    "-C",
    "link-arg=-sFULL_ES3=1",
    "-C",
    "link-arg=-sALLOW_MEMORY_GROWTH=1",
    "-C",
    "link-arg=-sASSERTIONS=1",
    "-C",
    "link-arg=-lwebsocket.js",
    "-C",
    "link-arg=-sSUPPORT_LONGJMP=emscripten",
    "-C",
    "link-arg=-sINITIAL_MEMORY=134217728",
]
# Skia must be compiled by APPLE clang: with Homebrew LLVM first on
# PATH, gn resolves bare `clang++` to it, and Homebrew's libc++
# headers emit strong refs to new symbols (std::__1::__hash_memory)
# that Apple's linker then rejects at the default deployment minimum.
# Linux/emscripten skia builds don't read these (prebuilts / emcc).
[env]
CLANGCC = "/usr/bin/clang"
CLANGCXX = "/usr/bin/clang++"
