[package]
name = "agent-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "himark-agent-host"
path = "src/main.rs"

[dependencies]
ahp = "0.7"
base64 = "0.22"
ahp-types = "0.7"
hifind = { path = "../find" }
higit = { path = "../git" }
host-discovery = { path = "../../protocol/host-discovery" }
tracing = "0.1"
himark-ahp-ext-types = { path = "../../protocol/ahp-ext-types" }
himark-text = { path = "../../frontend/text", package = "text" }
humantime = "2"
libc = "0.2"
notify = "8"
rpds = "1"
rustix = { version = "1", features = ["termios"] }
rustix-openpty = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "sync", "macros", "signal", "process", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio", "ws"] }
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"

[dev-dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tempfile = "3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
