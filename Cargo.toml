[workspace]
# The rune crates are NOT members: they depend by path on the
# sibling ../rune checkout, which exists only on development
# machines — as members they kill `cargo metadata` (and with it
# all of CI) wherever that checkout is absent. Each is its own
# workspace; build them from their directories.
exclude = ["frontend/himark-rune", "examples/editor-rune"]
members = [
    "frontend/rope",
    "frontend/sumtree",
    "frontend/operation",
    "frontend/rebase",
    "frontend/text",
    "frontend/intervals",
    "frontend/tokenize",
    "frontend/mdparser",
    "frontend/gfx",
    "frontend/gfx-skia",
    "frontend/gfx-gpui",
    "frontend/gfx-faces",
    "frontend/imba",
    "frontend/editor",
    "frontend/hisitter",
    "frontend/hiscript",
    "frontend/hikit",
    "frontend/changesview",
    "frontend/canvas",
    "frontend/comments",
    "frontend/documents",
    "frontend/filetree",
    "frontend/ahp-changes",
    "frontend/ahp-chat",
    "frontend/ahp-comments",
    "frontend/ahp-docsync",
    "frontend/ahp-lsp",
    "frontend/ahp-locations",
    "frontend/ahp-wire",
    "frontend/ahp-session",
    "frontend/locations",
    "frontend/recents",
    "frontend/himark-tests",
    "frontend/terminals",
    "frontend/toc",
    "frontend/workbench",
    "frontend/himark",
    "frontend/workbench-shell",
    "frontend/plugins/himarkdown",
    "frontend/plugins/demo",
    "frontend/plugins/himermaid",
    "frontend/plugins/palette",
    "frontend/plugins/peeker",
    "frontend/plugins/hicode",
    "frontend/plugins/hiterminal",
    "frontend/plugins/lang/*",
    "frontend/himark-ffi",
    "frontend/himark-plugins",
    "frontend/hitailnet",
    "frontend/hiahp",
    "frontend/desktop",
    "frontend/imba-gpui",
    "frontend/himark-gpui",
    "backend/agent-host",
    "backend/find",
    "backend/git",
    "protocol/ahp-ext-types",
    "protocol/host-discovery",
    "protocol/tailnet",
    "apps/web",
    "apps/desktop",
    "apps/web/tools/grammar-pack",
    "examples/editor-gpui",
    "examples/hello-gpui",
    "vendor/difftastic-core",
    "vendor/fsp-types",
    "vendor/ghostty-sys",
    "frontend/myersdiff",
    "frontend/structdiff",
]
default-members = [
    "frontend/rope",
    "frontend/operation",
    "frontend/rebase",
    "frontend/text",
    "frontend/intervals",
    "frontend/tokenize",
    "frontend/mdparser",
    "frontend/gfx",
    "frontend/gfx-skia",
    "frontend/gfx-gpui",
    "frontend/gfx-faces",
    "frontend/imba",
    "frontend/editor",
    "frontend/hisitter",
    "frontend/hikit",
    "frontend/changesview",
    "frontend/canvas",
    "frontend/comments",
    "frontend/documents",
    "frontend/filetree",
    "frontend/locations",
    "frontend/recents",
    "frontend/terminals",
    "frontend/toc",
    "frontend/workbench",
    "frontend/himark",
    "frontend/himark-tests",
    "frontend/plugins/himarkdown",
    "frontend/plugins/demo",
    "frontend/plugins/himermaid",
    "frontend/plugins/palette",
    "frontend/plugins/peeker",
    "frontend/plugins/hicode",
    "frontend/plugins/hiterminal",
    "frontend/plugins/lang/*",
    "frontend/himark-ffi",
    "frontend/himark-plugins",
    "frontend/hitailnet",
    "frontend/hiahp",
    "frontend/desktop",
    "backend/agent-host",
    "backend/find",
    "backend/git",
    "protocol/ahp-ext-types",
    "protocol/host-discovery",
    "protocol/tailnet",
    "apps/web",
