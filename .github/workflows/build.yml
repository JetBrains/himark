name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to main supersedes the running build; a tag build never does.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive version from the ref
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-dev.${SHA:0:7}"
          fi
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

  web:
    name: Web
    runs-on: ubuntu-24.04
    needs: version
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli clang libfontconfig1-dev libfreetype6-dev \
            ninja-build pkg-config
          # Emscripten's libc++ headers need Clang 20 or newer; the distro
          # libclang (18) cannot parse them when skia-bindings runs bindgen.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y libclang-22-dev

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src --target wasm32-unknown-emscripten

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-web-${{ hashFiles('**/Cargo.lock') }}

      - name: Checkout Emscripten SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emscripten-core/emsdk
          ref: e3a0604c3d130d6ab2c40e14a1861accd939a255 # 6.0.7
          path: target/emsdk
          persist-credentials: false

      - name: Install Emscripten
        run: |
          target/emsdk/emsdk install 6.0.7
          target/emsdk/emsdk activate 6.0.7

      - name: Build web application
        env:
          LIBCLANG_PATH: /usr/lib/llvm-22/lib
        run: |
          source target/emsdk/emsdk_env.sh
          bash apps/web/tools/build-web.sh

      - name: Package
        run: |
          stage="himark-${VERSION}-web"
          mkdir -p "dist/$stage"
          cp -R target/web/. "dist/$stage/"
          cp LICENSE "dist/$stage/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          rm -r "dist/$stage"

      # The staged site is bundled into the macOS app by the macos job.
      - name: Upload web site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-site
          path: target/web
          if-no-files-found: error

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-web
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: version
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-linux-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked -p linux -p agent-host

      - name: Package
        run: |
          stage="himark-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$stage"
          cp target/release/linux "dist/$stage/himark"
          cp target/release/himark-agent-host "dist/$stage/"
          cp LICENSE "dist/$stage/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          rm -r "dist/$stage"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: version
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-windows-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked -p windows --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $stage = "himark-$env:VERSION-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "dist/$stage" | Out-Null
          Copy-Item target/${{ matrix.target }}/release/windows.exe "dist/$stage/himark.exe"
          Copy-Item LICENSE "dist/$stage/"
          Set-Location dist
          7z a -tzip "$stage.zip" "$stage"
          Remove-Item -Recurse -Force "$stage"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (arm64)
    runs-on: macos-15
    needs: [version, web]
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-macos-${{ hashFiles('**/Cargo.lock') }}

      - name: Download web site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-site
          path: target/web

      - name: Build application bundle
        working-directory: apps/himark-apple
        env:
          HIMARK_VERSION: ${{ needs.version.outputs.version }}
          HIMARK_BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh mac

      - name: Package
        run: |
          stage="himark-${VERSION}-macos-arm64"
          mkdir -p "dist/$stage"
          ditto apps/himark-apple/build/Build/Products/Release/himark-macOS.app \
            "dist/$stage/himark-macOS.app"
          cp LICENSE "dist/$stage/"
          ditto -c -k --keepParent "dist/$stage" "dist/$stage.zip"
          rm -r "dist/$stage"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish draft release
    runs-on: ubuntu-24.04
    needs: [version, web, linux, windows, macos]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum -- * | tee SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "himark $VERSION" \
            dist/*
