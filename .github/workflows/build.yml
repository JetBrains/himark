name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to main supersedes the running build; a tag build never does.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # ghostty-sys builds vendor/ghostty (libghostty-vt) with Zig.
  ZIG_VERSION: 0.16.0

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive version from the ref
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-dev.${SHA:0:7}"
          fi
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

  web:
    name: Web
    runs-on: ubuntu-24.04
    needs: version
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli clang libfontconfig1-dev libfreetype6-dev \
            ninja-build pkg-config
          # Emscripten's libc++ headers need Clang 20 or newer; the distro
          # libclang (18) cannot parse them when skia-bindings runs bindgen.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y libclang-22-dev

      - name: Install pinned web Rust toolchain
        id: web-rust
        run: |
          toolchain="$(cat apps/web/rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rust-src --target wasm32-unknown-emscripten
          # Host tools (the grammar pack) use the default compiler too.
          compiler_key="$( { rustc -Vv; rustc +"$toolchain" -Vv; } | sha256sum | cut -d ' ' -f 1)"
          echo "cache-key=$compiler_key" >> "$GITHUB_OUTPUT"
          echo "rust-src=$(rustc +"$toolchain" --print sysroot)/lib/rustlib/src" >> "$GITHUB_OUTPUT"

      # Keep build-std's sysroot crates and fingerprints, including host build
      # scripts. Restore rust-src too: freshly installed source timestamps would
      # otherwise make Cargo rebuild std. Do not cache target/emsdk or the site.
      - name: Cache web dependencies and rebuilt standard library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.web-rust.outputs.rust-src }}
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
            target/wasm32-unknown-emscripten/release
          key: web-build-v1-${{ runner.os }}-${{ runner.arch }}-emscripten-6.0.7-${{ steps.web-rust.outputs.cache-key }}-${{ hashFiles('apps/web/rust-toolchain', 'apps/web/tools/**', '.cargo/config.toml', 'Cargo.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            web-build-v1-${{ runner.os }}-${{ runner.arch }}-emscripten-6.0.7-${{ steps.web-rust.outputs.cache-key }}-${{ hashFiles('apps/web/rust-toolchain', 'apps/web/tools/**', '.cargo/config.toml', 'Cargo.toml') }}-

      - name: Checkout Emscripten SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emscripten-core/emsdk
          ref: e3a0604c3d130d6ab2c40e14a1861accd939a255 # 6.0.7
          path: target/emsdk
          persist-credentials: false

      - name: Install Emscripten
        run: |
          target/emsdk/emsdk install 6.0.7
          target/emsdk/emsdk activate 6.0.7

      - name: Build web application
        env:
          LIBCLANG_PATH: /usr/lib/llvm-22/lib
        run: |
          source target/emsdk/emsdk_env.sh
          bash apps/web/tools/build-web.sh

      - name: Package
        run: |
          stage="himark-${VERSION}-web"
          mkdir -p "dist/$stage"
          cp -R target/web/. "dist/$stage/"
          cp LICENSE "dist/$stage/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          rm -r "dist/$stage"

      # The staged site is bundled into the macOS app by the macos job.
      - name: Upload web site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-site
          path: target/web
          if-no-files-found: error

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-web
          path: dist/*
          if-no-files-found: error

  pages:
    name: Publish GitHub Pages
    runs-on: ubuntu-24.04
    needs: web
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download web site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-site
          path: site

      # Pages cannot serve precompressed copies with a
      # Content-Encoding header; its CDN gzips on the fly.
      - name: Drop precompressed copies
        run: find site \( -name '*.gz' -o -name '*.br' \) -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  macos:
    name: macOS (arm64)
    runs-on: macos-15
    needs: [version, web]
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      # libtailscale-sys builds the embedded tailscale node with the
      # Go toolchain; the macos-15 image stopped shipping one.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 1.26: libtailscale's vendored tree reads encoding/json/v2,
          # default from this minor ('stable' resolved older on the
          # runner and died on undefined json.v2 names).
          go-version: "1.26"
          check-latest: true
          cache: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Cache native build dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
        with:
          shared-key: macos-release
          key: zig-${{ env.ZIG_VERSION }}
          cache-targets: true

      - name: Download web site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-site
          path: target/web

      - name: Build application bundle
        working-directory: apps/himark-apple
        env:
          HIMARK_VERSION: ${{ needs.version.outputs.version }}
          HIMARK_BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh mac

      - name: Package
        run: |
          stage="himark-${VERSION}-macos-arm64"
          mkdir -p "dist/$stage"
          ditto apps/himark-apple/build/Build/Products/Release/himark-macOS.app \
            "dist/$stage/himark-macOS.app"
          cp LICENSE "dist/$stage/"
          ditto -c -k --keepParent "dist/$stage" "dist/$stage.zip"
          rm -r "dist/$stage"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish draft release
    runs-on: ubuntu-24.04
    needs: [version, web, macos]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum -- * | tee SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "himark $VERSION" \
            dist/*
